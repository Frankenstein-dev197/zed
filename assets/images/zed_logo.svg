<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <g fill="none" stroke="#000000" stroke-width="28" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Cadre extérieur haut-gauche -->
    <path d="M 50 430 L 50 50 L 430 50" />

    <!-- Cadre extérieur bas-droite -->
    <path d="M 450 70 L 450 450 L 70 450" />

    <!-- Ligne diagonale centrale de la créature Z -->
    <line x1="60" y1="440" x2="440" y2="60" />

    <!-- Rectangle intérieur haut -->
    <path d="M 120 310 L 120 120 L 380 120" />

    <!-- Rectangle intérieur bas -->
    <path d="M 380 190 L 380 380 L 120 380" />

    <!-- Traits internes du Z -->
    <path d="M 190 200 L 310 200" />
    <path d="M 190 300 L 310 300" />
  </g>
</svg>
